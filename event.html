<!DOCTYPE html>
<html lang="ar" dir="rtl" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دليل فعاليات الجامعة - الجامعة الأكاديمية</title>
    <!-- Google Fonts: Cairo -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 RTL CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Custom Style -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Header & Navbar -->
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm">
            <div class="container">
                <a class="navbar-brand text-warning" href="index.html">
                    <i class="bi bi-calendar-event-fill me-2"></i>فعاليات الجامعة
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <li class="nav-item"><a class="nav-link " href="index.html">الرئيسية</a></li>
<li class="nav-item"><a class="nav-link active" href="events.html">كل الفعاليات</a></li>
<li class="nav-item"><a class="nav-link " href="about.html">عن الدليل</a></li>
<li class="nav-item"><a class="nav-link " href="contact.html">اتصل بنا</a></li>

                    </ul>
                    <div class="d-flex align-items-center gap-2">
                        <!-- زر تبديل الوضع المظلم Dark Mode -->
                        <button class="btn btn-outline-light btn-sm" onclick="toggleDarkMode()" title="تغيير النمط">
                            <i id="darkModeIcon" class="bi bi-moon-fill"></i>
                        </button>
                        <a class="btn btn-outline-warning btn-sm" href="events.html">
                            <i class="bi bi-search"></i> بحث
                        </a>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <main>
        <div class="container my-5">
            <a class="btn btn-outline-secondary mb-3" href="events.html">&larr; العودة لقائمة الفعاليات</a>
            <div id="event-detail-content" class="card shadow-sm p-4 mb-5"></div>

            <h4 class="fw-bold mb-3">فعاليات ذات صلة</h4>
            <div class="row g-4" id="related-events-container"></div>
        </div>

        <!-- Modal لحجز مكان في الفعالية -->
        <div class="modal fade" id="bookingModal" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title fw-bold" id="bookingModalTitle">حجز مقعد في الفعالية</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <form id="bookingForm" onsubmit="submitBooking(event)">
                            <div class="mb-3">
                                <label class="form-label">اسم الطالب الثلاثي</label>
                                <input type="text" class="form-control" id="studentName" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">الرقم الجامعي</label>
                                <input type="text" class="form-control" id="studentId" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">الكلية / التخصص</label>
                                <input type="text" class="form-control" id="studentMajor" required>
                            </div>
                            <button type="submit" class="btn btn-success w-100">تأكيد الحجز</button>
                        </form>
                        <div id="bookingSuccessAlert" class="alert alert-success mt-3 d-none">
                            تم حجز مقعدك بنجاح! تم إرسال التذكرة الوهمية إلى بريدك الجامعي.
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- زر العودة للأعلى (Scroll-to-top Button) -->
    <button id="scrollTopBtn" class="btn btn-warning shadow" onclick="scrollToTop()" title="العودة للأعلى">
        <i class="bi bi-arrow-up text-dark fw-bold"></i>
    </button>

    <!-- Footer -->
    <footer>
        <div class="container text-center">
            <p class="mb-0 small">&copy; 2026 دليل فعاليات الجامعة. جميع الحقوق محفوظة.</p>
        </div>
    </footer>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JavaScript -->
    <script src="js/main.js"></script>
</body>
</html>
