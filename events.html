<!DOCTYPE html>
<html lang="ar" dir="rtl" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دليل فعاليات الجامعة - الجامعة الأكاديمية</title>
    <!-- Google Fonts: Cairo -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 RTL CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Custom Style -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Header & Navbar -->
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm">
            <div class="container">
                <a class="navbar-brand text-warning" href="index.html">
                    <i class="bi bi-calendar-event-fill me-2"></i>فعاليات الجامعة
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <li class="nav-item"><a class="nav-link " href="index.html">الرئيسية</a></li>
<li class="nav-item"><a class="nav-link active" href="events.html">كل الفعاليات</a></li>
<li class="nav-item"><a class="nav-link " href="about.html">عن الدليل</a></li>
<li class="nav-item"><a class="nav-link " href="contact.html">اتصل بنا</a></li>

                    </ul>
                    <div class="d-flex align-items-center gap-2">
                        <!-- زر تبديل الوضع المظلم Dark Mode -->
                        <button class="btn btn-outline-light btn-sm" onclick="toggleDarkMode()" title="تغيير النمط">
                            <i id="darkModeIcon" class="bi bi-moon-fill"></i>
                        </button>
                        <a class="btn btn-outline-warning btn-sm" href="events.html">
                            <i class="bi bi-search"></i> بحث
                        </a>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <main>
        <div class="container my-5">
            <div class="row mb-4">
                <div class="col-12">
                    <h2 class="fw-bold mb-3">جميع الفعاليات المتاحة</h2>
                    <div class="card p-3 shadow-sm">
                        <div class="row g-3">
                            <div class="col-md-4">
                                <input type="text" id="searchInput" class="form-control" placeholder="ابحث عن عنوان الفعالية..." oninput="filterEvents()">
                            </div>
                            <div class="col-md-3">
                                <select id="categoryFilter" class="form-select" onchange="filterEvents()">
                                    <option value="">جميع التصنيفات</option>
                                    <option value="ثقافي">ثقافي</option>
                                    <option value="رياضي">رياضي</option>
                                    <option value="موسيقى">موسيقى</option>
                                    <option value="عائلي">عائلي/اجتماعي</option>
                                </select>
                            </div>
                            <div class="col-md-3">
                                <select id="locationFilter" class="form-select" onchange="filterEvents()">
                                    <option value="">جميع الأماكن</option>
                                    <option value="المسرح الكبير">المسرح الكبير</option>
                                    <option value="الصالة الرياضية">الصالة الرياضية</option>
                                    <option value="قاعة المؤتمرات">قاعة المؤتمرات</option>
                                </select>
                            </div>
                            <div class="col-md-2">
                                <button class="btn btn-secondary w-100" onclick="resetFilters()">إعادة ضبط</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="row g-4" id="all-events-container"></div>
        </div>
    </main>

    <!-- زر العودة للأعلى (Scroll-to-top Button) -->
    <button id="scrollTopBtn" class="btn btn-warning shadow" onclick="scrollToTop()" title="العودة للأعلى">
        <i class="bi bi-arrow-up text-dark fw-bold"></i>
    </button>

    <!-- Footer -->
    <footer>
        <div class="container text-center">
            <p class="mb-0 small">&copy; 2026 دليل فعاليات الجامعة. جميع الحقوق محفوظة.</p>
        </div>
    </footer>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JavaScript -->
    <script src="js/main.js"></script>
</body>
</html>
